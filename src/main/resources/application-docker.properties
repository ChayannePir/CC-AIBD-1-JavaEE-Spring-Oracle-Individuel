# Configuration pour d?ploiement Docker

spring.application.name=Medical API - Docker Deployment
spring.profiles.active=docker

# Server
server.port=8080
server.servlet.context-path=/

# MongoDB Configuration (via docker-compose)
# URL fournie via la variable d'environnement SPRING_DATA_MONGODB_URI
# Par d?faut: mongodb://mongouser:mongopass@mongodb:27017/medical_db

# Logging
logging.level.root=INFO
logging.level.com.medical=INFO
logging.file.path=/app/logs/
logging.file.name=/app/logs/medical-api.log

# JWT
# jwt.secret et jwt.expiration sont fournis via variables d'environnement

# Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# File Upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Actuator
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always
