# JPA/Hibernate Properties

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
# Use 'update' for development, 'none' or 'validate' for production

# Spring Security
spring.security.user.name=user
spring.security.user.password=password
spring.security.user.roles=USER

# JWT Properties (example values, should be externalized in production)
jwt.secret=aSecretKeyForJWTThatIsLongEnoughAndSecureForProductionEnvironment
jwt.expiration=3600000 
# 1 hour in milliseconds

# Springdoc OpenAPI/Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
