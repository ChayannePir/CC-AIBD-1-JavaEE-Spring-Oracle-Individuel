# ============================================================================
# Configuration de l'application Medical API
# ============================================================================

# ============================================================================
# Spring Boot Settings
# ============================================================================
spring.application.name=Medical API
spring.profiles.active=dev

# ============================================================================
# Server Configuration
# ============================================================================
# Port du serveur
server.port=8080

# Chemin contextuel (optionnel)
server.servlet.context-path=/

# Encodage des caractères
server.servlet.encoding.charset=UTF-8

# ============================================================================
# MongoDB Configuration
# ============================================================================
# URL de connexion MongoDB
# Format: mongodb://[username:password]@host:port/database
# Pour MongoDB local: mongodb://localhost:27017/medical_db
# Pour MongoDB Atlas (cloud): mongodb+srv://username:password@hostname/database
spring.data.mongodb.uri=mongodb://localhost:27017/medical_db

# Alternative à URI (si pas d'authentification):
# spring.data.mongodb.host=localhost
# spring.data.mongodb.port=27017
# spring.data.mongodb.database=medical_db

# ============================================================================
# Logging Configuration
# ============================================================================
# Niveau de log par défaut
logging.level.root=INFO

# Niveau de log pour le package application
logging.level.com.medical=DEBUG

# Format du log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Fichier de log
logging.file.path=logs/
logging.file.name=logs/medical-api.log

# ============================================================================
# JWT Configuration
# ============================================================================
# Secret pour signer les tokens JWT (minimum 32 caractères)
# ATTENTION: À changer en production avec une clé sécurisée
jwt.secret=mySecretKeyForJWTSigningThatIsAtLeast32CharactersLongAndStronger

# Durée d'expiration du token JWT en millisecondes
# 86400000 = 24 heures
jwt.expiration=86400000

# ============================================================================
# Swagger/OpenAPI Configuration
# ============================================================================
# URL de la documentation Swagger UI
# http://localhost:8080/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ============================================================================
# Jackson Configuration (Sérialisation JSON)
# ============================================================================
# Inclure les dates en ISO format (ex: 2024-07-17T14:30:00)
spring.jackson.serialization.write-dates-as-timestamps=false

# Ignorer les propriétés non reconnues lors de la désérialisation JSON
spring.jackson.deserialization.fail-on-unknown-properties=false

# ============================================================================
# File Upload Configuration
# ============================================================================
# Taille maximale d'un fichier uploadé (10 MB)
spring.servlet.multipart.max-file-size=10MB

# Taille maximale de la requête (10 MB)
spring.servlet.multipart.max-request-size=10MB

# ============================================================================
# Actuator Configuration (Monitoring)
# ============================================================================
# Endpoints actuator activés (health, metrics, etc.)
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always

# ============================================================================
# Development Settings
# ============================================================================
# Rechargement automatique en développement
spring.devtools.restart.enabled=true

# Cache désactivé en développement
spring.cache.type=none

