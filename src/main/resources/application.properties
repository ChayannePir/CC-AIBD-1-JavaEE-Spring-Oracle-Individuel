# ============================================================================
# Configuration de l'application Medical API
# ============================================================================

# ============================================================================
# Spring Boot Settings
# ============================================================================
spring.application.name=Medical API
spring.profiles.active=dev

# ============================================================================
# Server Configuration
# ============================================================================
server.port=8080
server.servlet.context-path=/
server.servlet.encoding.charset=UTF-8

# ============================================================================
# MongoDB Configuration
# ============================================================================
spring.data.mongodb.uri=mongodb://localhost:27017/medical_db

# ============================================================================
# Logging Configuration
# ============================================================================
logging.level.root=INFO
logging.level.com.medical=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.path=logs/
logging.file.name=logs/medical-api.log

# ============================================================================
# JWT Configuration
# ============================================================================
jwt.secret=mySecretKeyForJWTSigningThatIsAtLeast32CharactersLongAndStronger
jwt.expiration=86400000

# ============================================================================
# Swagger/OpenAPI Configuration
# ============================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ============================================================================
# Jackson Configuration (Serialisation JSON)
# ============================================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ============================================================================
# File Upload Configuration
# ============================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================================================
# Actuator Configuration (Monitoring)
# ============================================================================
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always

# ============================================================================
# Development Settings
# ============================================================================
spring.devtools.restart.enabled=true
spring.cache.type=none
