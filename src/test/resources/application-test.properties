# Configuration de test avec MongoDB Embedded

spring.application.name=Medical API - Test
spring.profiles.active=test

# Server
server.port=8081

# MongoDB Embedded (pour les tests)
spring.data.mongodb.auto-index-creation=true

# Logging - Plus verbeux pour les tests
logging.level.root=INFO
logging.level.com.medical=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG

# JWT
jwt.secret=testSecretKeyForJWTThatIsAtLeast32CharactersLongForTesting
jwt.expiration=3600000  # 1 heure

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# File Upload
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

